<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700"><text x="91" y="65" dominant-baseline="hanging" font-family="Noto Sans CJK SC" font-size="24" fill="#202020">车又晚点了。</text><text x="575" y="67" dominant-baseline="hanging" font-family="Noto Sans CJK SC" font-size="24" fill="#202020">走过去吧。</text><text x="70" y="382" dominant-baseline="hanging" font-family="Noto Sans CJK SC" font-size="24" fill="#202020">下雨了。</text><text x="532" y="381" dominant-baseline="hanging" font-family="Noto Sans CJK SC" font-size="24" fill="#202020">一起撑伞吧。</text></svg>